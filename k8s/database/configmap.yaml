apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: devops-learning
data:
  # Direct RDS endpoint preserves hostname verification with sslmode=verify-full.
  # The ExternalName service is available for DNS discovery; its alias does not
  # normally match the hostname on the RDS certificate.
  DB_HOST: REPLACE_WITH_RDS_ENDPOINT.rds.amazonaws.com
  DB_PORT: "5432"
  DB_NAME: devops_learning
  DB_SSLMODE: verify-full
  DB_SSLROOTCERT: /certs/global-bundle.pem
  DB_CONNECT_TIMEOUT: "10"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
