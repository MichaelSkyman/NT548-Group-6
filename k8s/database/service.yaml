apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: devops-learning
spec:
  type: ExternalName
  # Replace with the private RDS endpoint. Do not include a URL scheme or port.
  externalName: REPLACE_WITH_RDS_ENDPOINT.rds.amazonaws.com
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
