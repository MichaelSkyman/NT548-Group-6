apiVersion: batch/v1
kind: Job
metadata:
  # Use a new name/tag for each release; a completed Job will not run again.
  name: database-migration-0001
  namespace: devops-learning
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: REPLACE_WITH_REGISTRY/nt548-database:0001
          command: ["python", "-m", "database", "migrate"]
          envFrom:
            - configMapRef:
                name: database-config
            - secretRef:
                name: database-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rds-ca
              mountPath: /certs
              readOnly: true
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca
