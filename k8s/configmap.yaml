# Cấu hình không nhạy cảm cho backend và Job migration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: devops-app
data:
  # Alias "postgres" in database-service.yaml is used by the TCP/DNS check.
  # Use the real RDS hostname for TLS hostname verification.
  DB_HOST: REPLACE_WITH_RDS_ENDPOINT.rds.amazonaws.com
  DB_PORT: "5432"
  DB_NAME: devops_learning
  DB_SSLMODE: verify-full
  DB_SSLROOTCERT: /certs/global-bundle.pem
  # Frontend và API cùng domain qua ALB nên không cần giới hạn CORS chặt
  ALLOWED_ORIGINS: "*"
  FLASK_DEBUG: "0"
  JWT_ACCESS_TOKEN_MINUTES: "60"
  QUIZ_SIZE: "15"
  QUIZ_TOKEN_MAX_AGE: "3600"
