# Chỉ chứa giá trị nhạy cảm; cấu hình thường nằm ở configmap.yaml.
# KHÔNG commit giá trị thật. Thay các <...> trước khi apply:
#   DB_PASSWORD     = db_password trong infra/terraform.tfvars
#   SECRET_KEY,
#   JWT_SECRET_KEY  = openssl rand -hex 32
#   ADMIN_PASSWORD  = mật khẩu tài khoản admin do seed.py tạo
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devops-app
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: "<YOUR_DB_PASSWORD>"
  SECRET_KEY: "<RANDOM_SECRET_KEY>"
  JWT_SECRET_KEY: "<RANDOM_JWT_SECRET_KEY>"
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: "<YOUR_ADMIN_PASSWORD>"
