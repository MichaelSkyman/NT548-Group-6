# Reverse proxy cho docker compose, đóng vai trò giống ALB Ingress trên EKS:
#   /api/*  -> backend:8000
#   /*      -> frontend
# Chỉ dùng ở local. Trên EKS việc này do Ingress (ALB) làm.

server {
  listen 80;
  server_name _;

  # DNS nội bộ của Docker. Dùng biến trong proxy_pass để nginx phân giải tên
  # lúc có request, không phải lúc khởi động. Nếu viết thẳng "proxy_pass http://backend:8000"
  # thì khi backend chưa lên, nginx crash với lỗi "host not found in upstream".
  resolver 127.0.0.11 valid=10s;

  location /api {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $frontend_upstream http://frontend:8080;
    proxy_pass $frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
