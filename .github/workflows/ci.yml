# CI: kiểm tra code mỗi khi có Pull Request hoặc push lên main.
# Không dùng secret, không đụng AWS: chạy được trên PR từ bất kỳ ai.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Hai lần chạy cho cùng một nhánh thì huỷ lần cũ, đỡ tốn phút chạy
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Quyền tối thiểu cho GITHUB_TOKEN: chỉ đọc code
permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, Python 3.12)
    runs-on: ubuntu-latest
    services:
      # PostgreSQL thật để chạy cả 12 test tích hợp (nếu thiếu thì bị skip)
      postgres:
        image: postgres:15.20
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Cùng phiên bản với image production (backend/Dockerfile)
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q --cov=app --cov=database --cov-report=term-missing

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Cùng phiên bản với stage build trong frontend/Dockerfile
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci cài đúng theo package-lock.json (khác npm install, không tự sửa lock file)
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Chỉ build để chắc Dockerfile không hỏng, KHÔNG push. Push ECR là việc của cd.yml.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  terraform:
    name: Terraform (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra, infra/bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          # Bản tối thiểu mà code yêu cầu (required_version >= 1.10)
          terraform_version: "1.10.5"
      - name: fmt
        run: terraform fmt -check -recursive -diff
      # -backend=false: không cần bucket S3 hay quyền AWS để kiểm cú pháp
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  helm:
    name: Helm (lint, kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0
      - name: helm lint
        run: |
          helm lint charts/devops-app -f charts/devops-app/values-local.yaml
          helm lint charts/devops-app -f charts/devops-app/values-eks.yaml
      # Render chart ra YAML rồi kiểm theo JSON schema của Kubernetes 1.35 (phiên bản EKS đang dùng).
      # -strict: báo lỗi cả khi có trường lạ (thường là gõ sai tên trường).
      - name: kubeconform
        run: |
          for values in values-local values-eks; do
            echo "::group::$values"
            helm template ci charts/devops-app -n devops-app -f charts/devops-app/$values.yaml \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
                  -strict -summary -kubernetes-version 1.35.0 -
            echo "::endgroup::"
          done

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env.example đủ các biến bắt buộc nên `config` chạy được mà không cần bí mật thật
      - run: cp .env.example .env
      - run: docker compose config --quiet
