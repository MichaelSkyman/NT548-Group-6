{{- if .Values.database.externalName }}
# EKS: Service `postgres` là bí danh DNS trỏ tới RDS (ExternalName).
# Local: không render, vì deploy/local/postgres.yaml đã tạo Service `postgres` thật.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
  annotations:
    # Hook để tồn tại trước Job migrate (init container chờ DNS của Service này).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  type: ExternalName
  externalName: {{ .Values.database.externalName }}
{{- end }}
