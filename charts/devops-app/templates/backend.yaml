apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    {{- include "devops-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Đổi cấu hình => pod được tạo lại để nhận biến môi trường mới.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "devops-app.backendPodSecurityContext" . | nindent 8 }}
      initContainers:
        {{- include "devops-app.waitForDb" . | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: {{ .Values.secretName }}
          securityContext:
            {{- include "devops-app.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # gunicorn ghi file tạm vào /tmp; root filesystem chỉ đọc nên cần emptyDir.
            - name: tmp
              mountPath: /tmp
            {{- include "devops-app.rdsCaMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # Readiness: kiểm tra cả DB. Lỗi => pod ngừng nhận traffic (không bị restart).
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          # Liveness: chỉ kiểm tra process còn sống (/api/live không chạm DB),
          # để DB chập chờn không làm Kubernetes restart toàn bộ backend.
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "devops-app.rdsCaVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    {{- include "devops-app.labels" . | nindent 4 }}
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
