server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # (C) Health check cho ALB — trả 200, không ghi log.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # (B) API KHÔNG proxy ở đây. Trên EKS, ALB Ingress định tuyến theo path:
  #   /api/*  -> Service backend
  #   /*      -> Service frontend (container này)
  # Nhờ vậy container frontend chạy độc lập được (không phụ thuộc DNS "backend"),
  # và lúc dev thì proxy "/api" trong vite.config.js lo việc chuyển sang :8000.
  #
  # (Nếu nhóm muốn gộp 1 path và để NGINX tự proxy /api sang backend, phải dùng
  #  biến + resolver của cluster để nginx phân giải tên lúc chạy, không thì crash
  #  khi khởi động như lỗi "host not found in upstream". Mặc định ta đi hướng Ingress.)

  # (A) SPA fallback — mọi path khác trả index.html để react-router xử lý.
  # Thiếu dòng này thì refresh ở /topics/docker hay /admin sẽ 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
